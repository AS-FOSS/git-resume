<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#525659;height:100vh;display:flex;flex-direction:column}
  .toolbar{background:#1a1a1a;color:#fff;display:flex;align-items:center;padding:.5rem 1rem;gap:.75rem;flex-shrink:0;flex-wrap:wrap}
  .toolbar h1{font-size:1rem;font-weight:500;margin-right:.25rem}
  select{padding:.4rem .5rem;border-radius:4px;border:1px solid #555;background:#333;color:#fff;font-size:.875rem;cursor:pointer}
  select:focus{outline:none;border-color:#2563eb}
  .btn{display:inline-block;padding:.4rem 1rem;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.875rem;text-decoration:none;line-height:1.4;margin-left:auto}
  .btn:hover{background:#1d4ed8}
  #viewerContainer{flex:1;overflow:auto;padding:1rem}
  #viewerContainer canvas{display:block;margin:0 auto 8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #viewerContainer p{text-align:center;padding:2rem;color:#999}
  #viewerContainer a{color:#60a5fa}
</style>
</head>
<body>
<div class="toolbar">
  <h1 id="pageTitle">Resume</h1>
  <select id="profileSelect"></select>
  <select id="versionSelect"></select>
  <a class="btn" id="downloadBtn" href="#" download>Download</a>
</div>
<div id="viewerContainer"><p>Loading version list…</p></div>
<script type="module">
const owner='{{OWNER}}',repo='{{REPO}}';
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.1.200/pdf.worker.min.mjs';

const viewer=document.getElementById('viewerContainer'),downloadBtn=document.getElementById('downloadBtn'),profileSelect=document.getElementById('profileSelect'),versionSelect=document.getElementById('versionSelect'),pageTitle=document.getElementById('pageTitle'),variants={};

async function renderBytes(b){
  viewer.innerHTML='';
  const pdf=await pdfjsLib.getDocument({data:b}).promise,dpr=window.devicePixelRatio||1,tw=Math.min(viewer.clientWidth||850,850);
  for(let n=1;n<=pdf.numPages;n++){
    const pg=await pdf.getPage(n),us=pg.getViewport({scale:1}),s=(tw/us.width)*dpr,vp=pg.getViewport({scale:s});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    c.style.cssText='width:'+tw+'px;height:'+(vp.height/dpr)+'px';
    viewer.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise
  }
}

async function loadVersion(e){
  downloadBtn.href=e.url;downloadBtn.download=e.name;
  viewer.innerHTML='<p>Loading PDF…</p>';
  try{
    const pdfUrl=e.date?'pdfs/'+e.variant+'/'+e.date+'.pdf':'pdfs/'+e.variant+'/latest.pdf';
    const r=await fetch(pdfUrl);if(!r.ok)throw Error();
    renderBytes(new Uint8Array(await r.arrayBuffer()))
  }catch(_){viewer.innerHTML='<p>Failed to load. <a href="'+e.url+'">Download instead</a>.</p>'}
}

function selectVariant(id){
  const v=variants[id];versionSelect.innerHTML='';
  v.versions.forEach((ver,i)=>{const o=document.createElement('option');o.value=i;o.textContent=ver.label;versionSelect.appendChild(o)});
  pageTitle.textContent=v.label+' — Resume';loadVersion(v.versions[0])
}

try{
  const releases=await(await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/releases')).json();
  for(const rel of releases){
    const a=(rel.assets||[]).find(a=>a.name.endsWith('.pdf'));if(!a)continue;let m;
    m=rel.tag_name.match(/^latest-(.+)$/);if(m){const id=m[1];if(!variants[id])variants[id]={label:rel.name||id,versions:[]};variants[id].label=rel.name||id;variants[id].versions.unshift({label:'Latest',url:a.browser_download_url,name:a.name,variant:id,date:null});continue}
    m=rel.tag_name.match(/^resume-(.+)-(\d{4}-\d{2}-\d{2})$/);if(m){const id=m[1],date=m[2];if(!variants[id])variants[id]={label:id,versions:[]};variants[id].versions.push({label:date,url:a.browser_download_url,name:a.name,variant:id,date:date})}
  }
  const ids=Object.keys(variants).sort();
  ids.forEach(id=>profileSelect.add(new Option(variants[id].label,id)));
  profileSelect.addEventListener('change',()=>selectVariant(profileSelect.value));
  versionSelect.addEventListener('change',()=>{const v=variants[profileSelect.value].versions[versionSelect.value];loadVersion(v)});
  if(ids.length)selectVariant(ids[0])
}catch(_){viewer.innerHTML='<p>Failed to load releases. <a href="https://github.com/'+owner+'/'+repo+'/releases">View on GitHub</a>.</p>'}
</script>
</body>
</html>
